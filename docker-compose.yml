services:
  mpcwithgenerativeart:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/romzombie/mpcwithgenerativeart:latest
    container_name: mpc-with-generative-art
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GENERATOR_PROVIDER=perchance
      - XAI_API_KEY=
      - GEMINI_API_KEY=
      - OPENAI_API_KEY=
      - HF_TOKEN=
      - GENERATOR_TIMEOUT=300.0
      - GENERATOR_READ_TIMEOUT=300.0
      - GENERATOR_CONNECT_TIMEOUT=60.0
      - GENERATOR_WRITE_TIMEOUT=60.0
    volumes:
      - mpc_output:/app/output
      - mpc_cache:/app/cache

volumes:
  mpc_output:
    name: mpc_output_data
  mpc_cache:
    name: mpc_cache_data
